<main>
    <section id="berish">
        <h2>E'lon berish</h2>
        <p>Mahalla aholisi uchun e'lon ma'lumotlarini kiriting.</p>

        <form id="elonForm" action="#" method="post"
              enctype="multipart/form-data">

            <label for="ism">Ismingiz</label>
            <input type="text" id="ism" name="ism"
                   placeholder="Ismingizni yozing" required>

            <label for="sarlavha">E'lon sarlavhasi</label>
            <input type="text" id="sarlavha" name="sarlavha"
                   placeholder="Masalan: Velosiped sotiladi" required>

            <label for="matn">E'lon matni</label>
            <textarea id="matn" name="matn" rows="5"
                      placeholder="E'lon matnini yozing" required></textarea>

            <label for="telefon">Telefon raqami</label>
            <input type="tel" id="telefon" name="telefon"
                   placeholder="+998 90 123 45 67" required>

            <label for="audio">Audio (ixtiyoriy)</label>
            <input type="file" id="audio" name="audio" accept="audio/*">

            <label for="video">Video (ixtiyoriy)</label>
            <input type="file" id="video" name="video" accept="video/*">

            <label for="pdf">PDF hujjat (ixtiyoriy)</label>
            <input type="file" id="pdf" name="pdf"
                   accept="application/pdf">

            <button type="submit">E'lon yuborish</button>
        </form>

      
    </section>
</main>
